name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  linux-validation:
    name: Linux Unit & E2E Mock Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run TTL Syntax and E2E Tests
        run: |
          python -m unittest discover -s tests -v

      - name: Upload Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs-linux
          path: logs/
          if-no-files-found: ignore

  windows-validation:
    name: Windows Real Tera Term 5.4.1 & Real SSH2/Telnet E2E
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Unit & E2E Simulation on Windows
        run: |
          python -m unittest discover -s tests -v

      - name: Install paramiko for Real SSH2 CI Server
        run: |
          pip install --quiet paramiko
          python tests/real_ssh_ci_server.py --self-test

      - name: Download Portable Tera Term 5.4.1
        shell: pwsh
        run: |
          $zipPath = "$env:RUNNER_TEMP\teraterm-5.4.1.zip"
          Invoke-WebRequest -Uri "https://github.com/TeraTermProject/teraterm/releases/download/v5.4.1/teraterm-5.4.1.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "C:\teraterm5" -Force
          $ttp = Get-ChildItem -Path "C:\teraterm5" -Filter "ttpmacro.exe" -Recurse | Select-Object -First 1
          if (-not $ttp) {
            Write-Error "ttpmacro.exe not found in C:\teraterm5"
            exit 1
          }
          Write-Host "Found real ttpmacro.exe at: $($ttp.FullName)"
          "TTPMACRO_EXE=$($ttp.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $iniPath = Join-Path $ttp.DirectoryName "TERATERM.INI"
          if (Test-Path $iniPath) {
            (Get-Content $iniPath) -replace 'ConfirmDisconnect=on', 'ConfirmDisconnect=off' | Set-Content $iniPath
          }

      - name: Run Real Tera Term 5.4.1 Macro Against Real SSH2 & Telnet Servers
        shell: pwsh
        run: |
          $ws = (Get-Location).Path
          $credCsv = Join-Path $ws "ci_cred.csv"
          $devCsv  = Join-Path $ws "ci_device.csv"
          $logDir  = Join-Path $ws "ci_logs"

          @(
            "# Pattern,Username,Password,EnablePassword,Protocol",
            "WrongPat,wrong_u,WRONG_PASS,,",
            "CiscoStd,admin,Pass1234,EnablePass123,"
          ) | Set-Content -Path $credCsv -Encoding UTF8

          @(
            "# Hostname,IP,Username,Password,EnablePassword,Protocol,CommandFile",
            "CI-SSH-AUTO,192.168.10.1,,,,ssh,commands_cisco.txt",
            "CI-LEGACY-SSH,192.168.10.249,,,,ssh,commands_cisco.txt",
            "CI-TELNET-AUTO,192.168.10.252,,,,,commands_cisco.txt",
            "CI-NO-TELNET,192.168.10.251,,,,telnet,commands_cisco.txt"
          ) | Set-Content -Path $devCsv -Encoding UTF8

          $srvOut = Join-Path $ws "ci_server_out.log"
          $srvErr = Join-Path $ws "ci_server_err.log"
          $srv = Start-Process -FilePath "python" -ArgumentList "tests/real_ssh_ci_server.py" -RedirectStandardOutput $srvOut -RedirectStandardError $srvErr -PassThru -NoNewWindow
          Start-Sleep -Seconds 2

          try {
            $runnerTtl = Join-Path $ws "runner.ttl"
            $macroArgs = @(
              "/V",
              "`"$runnerTtl`"",
              "`"$logDir`"",
              "mock_pass",
              "`"$devCsv`"",
              "`"$credCsv`"",
              "1",
              "127.0.0.1",
              "2222",
              "bastion_user"
            )
            Write-Host "Launching real ttpmacro.exe: $env:TTPMACRO_EXE $($macroArgs -join ' ')"
            $proc = Start-Process -FilePath $env:TTPMACRO_EXE -ArgumentList $macroArgs -PassThru
            $deadline = (Get-Date).AddSeconds(60)
            $done = $false
            while ((Get-Date) -lt $deadline) {
              if ($proc.HasExited) {
                $done = $true
                break
              }
              $sumFile = Get-ChildItem -Path $logDir -Filter "summary_*.csv" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($sumFile) {
                $sumLines = (Get-Content $sumFile.FullName -ErrorAction SilentlyContinue | Where-Object { $_ -and -not $_.StartsWith("Timestamp") })
                if ($sumLines.Count -ge 4) {
                  Start-Sleep -Seconds 2
                  $done = $true
                  break
                }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Get-Process ttermpro -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }
            if (-not $done) {
              Write-Host "=== CI SERVER STDOUT ==="
              if (Test-Path $srvOut) { Get-Content $srvOut }
              Write-Host "=== CI SERVER STDERR ==="
              if (Test-Path $srvErr) { Get-Content $srvErr }
              Write-Error "Real ttpmacro.exe did not complete all 4 devices within 60s!"
              exit 1
            }
            Write-Host "Real Tera Term 5.4.1 completed all 4 devices cleanly!"
          }
          finally {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
            Get-Process ttermpro -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

          python -c @"
          import glob, os, sys
          log_dir = r'$logDir'
          sums = glob.glob(os.path.join(log_dir, 'summary_*.csv'))
          assert sums, f'No summary CSV found in {log_dir}'
          with open(sums[-1], 'r', encoding='utf-8') as f:
              txt = f.read()
          print('=== REAL TERA TERM SUMMARY ===\n' + txt)
          rows = {l.split(',')[1]: l.split(',') for l in txt.splitlines() if l.strip() and not l.startswith('Timestamp')}
          assert rows['CI-SSH-AUTO'][5] == 'OK' and rows['CI-SSH-AUTO'][7] == 'admin' and rows['CI-SSH-AUTO'][8] == 'CiscoStd', rows
          assert rows['CI-LEGACY-SSH'][5] == 'OK' and rows['CI-LEGACY-SSH'][3] == 'ssh' and rows['CI-LEGACY-SSH'][8] == 'CiscoStd', rows
          assert rows['CI-TELNET-AUTO'][5] == 'OK' and rows['CI-TELNET-AUTO'][3] == 'telnet' and rows['CI-TELNET-AUTO'][8] == 'CiscoStd', rows
          assert rows['CI-NO-TELNET'][5] == 'NG' and 'Telnet Not Accepted' in rows['CI-NO-TELNET'][6], rows

          dev_logs = glob.glob(os.path.join(log_dir, 'devices', 'CI-SSH-AUTO_*.log'))
          assert dev_logs, 'Device log missing from logs/devices/'
          with open(dev_logs[0], 'r', encoding='utf-8') as f:
              assert 'Cisco IOS Software' in f.read()

          with open(r'$credCsv', 'r', encoding='utf-8') as f:
              clines = [l.strip() for l in f if l.strip()]
          assert clines[1] == 'CiscoStd,admin,Pass1234,EnablePass123,', f'Expected promoted row first, got: {clines}'
          print('ALL REAL TERA TERM 5.4.1 E2E ASSERTIONS PASSED!')
          "@

      - name: Upload Windows Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs-windows
          path: ci_logs/
          if-no-files-found: ignore
